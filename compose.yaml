services:

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: rosterly 
      POSTGRES_PASSWORD: rosterly 
      POSTGRES_DB: rosterly
    ports:
      - "5432:5432"
    volumes:
      - rosterly_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rosterly:rosterly@db:5432/rosterly?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  rosterly_data:
    driver: local
